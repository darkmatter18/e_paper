<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Paper Display Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .status-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .status-row:last-child {
            margin-bottom: 0;
        }

        .status-label {
            color: #666;
            font-size: 14px;
        }

        .status-value {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.healthy {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.running {
            background: #d1ecf1;
            color: #0c5460;
        }

        .screens-section {
            margin-bottom: 30px;
        }

        .screens-section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .screen-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .screen-button {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-size: 16px;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .screen-button:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .screen-button.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .screen-button.loading {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .screen-icon {
            font-size: 20px;
        }

        .refresh-button {
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .refresh-button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .refresh-button:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 15px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.visible {
            display: block;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖥️ E-Paper Display Control</h1>
        <p class="subtitle">Control your Waveshare 7.5" display remotely</p>

        <div class="status-card">
            <div class="status-row">
                <span class="status-label">Status</span>
                <span class="status-badge healthy" id="health-status">{{ health_status }}</span>
            </div>
            <div class="status-row">
                <span class="status-label">Engine</span>
                <span class="status-badge running" id="engine-status">
                    {{ "Running" if engine_running else "Stopped" }}
                </span>
            </div>
        </div>

        <div class="screens-section">
            <h2>Available Screens</h2>
            <div class="screen-grid">
                {% for screen in screens %}
                <button
                    class="screen-button {% if screen.key == current_screen %}active{% endif %}"
                    onclick="switchScreen('{{ screen.key }}')"
                    data-screen="{{ screen.key }}"
                >
                    <span>
                        <span class="screen-icon">{{ screen.icon }}</span>
                        {{ screen.display_name }}
                    </span>
                    <span class="checkmark" style="{% if screen.key != current_screen %}display: none;{% endif %}">✓</span>
                </button>
                {% endfor %}
            </div>
        </div>

        <button class="refresh-button" onclick="refreshStatus()">
            🔄 Refresh Status
        </button>

        <a href="/logout" style="display: block; margin-top: 15px; text-align: center; color: #667eea; text-decoration: none; font-size: 14px;">
            Logout
        </a>

        <div id="message" class="message"></div>

        <div class="footer">
            E-Paper Display API v1.0.0
        </div>
    </div>

    <script>
        let isLoading = false;

        async function switchScreen(screenName) {
            if (isLoading) return;

            // Check if this screen is already active
            const activeButton = document.querySelector('.screen-button.active');
            if (activeButton && activeButton.dataset.screen === screenName) {
                showMessage('Already on ' + screenName, 'success');
                return;
            }

            isLoading = true;
            const buttons = document.querySelectorAll('.screen-button');
            buttons.forEach(btn => btn.classList.add('loading'));

            try {
                const response = await fetch('/api/v1/screen', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ screen: screenName })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(data.message || 'Screen switched successfully!', 'success');
                    await refreshStatus();
                } else {
                    showMessage(data.detail || 'Failed to switch screen', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            } finally {
                isLoading = false;
                buttons.forEach(btn => btn.classList.remove('loading'));
            }
        }

        async function refreshStatus() {
            try {
                const response = await fetch('/health');
                const data = await response.json();

                // Update status display
                document.getElementById('health-status').textContent = data.status || 'healthy';
                document.getElementById('engine-status').textContent = data.engine_running ? 'Running' : 'Stopped';

                // Update active button and checkmark
                const buttons = document.querySelectorAll('.screen-button');
                buttons.forEach(btn => {
                    const checkmark = btn.querySelector('.checkmark');
                    if (btn.dataset.screen === data.current_screen) {
                        btn.classList.add('active');
                        if (checkmark) checkmark.style.display = 'inline';
                    } else {
                        btn.classList.remove('active');
                        if (checkmark) checkmark.style.display = 'none';
                    }
                });
            } catch (error) {
                showMessage('Failed to refresh status: ' + error.message, 'error');
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message visible ' + type;

            setTimeout(() => {
                messageDiv.classList.remove('visible');
            }, 3000);
        }

        // Auto-refresh every 10 seconds
        setInterval(async () => {
            if (!isLoading) {
                await refreshStatus();
            }
        }, 10000);
    </script>
</body>
</html>
